<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="22" height="22" />
    <strong>DSH Page Bridge</strong>
    <span id="conn" class="pill">连接中…</span>
    <button id="settings" class="ghost" title="设置">⚙</button>
  </header>

  <section id="card" class="card idle">
    <div id="statusIcon" class="status-icon">•</div>
    <div class="status-text">
      <div id="statusTitle">还没有发送页面</div>
      <div id="statusSub">按 Alt+Shift+S，或点下面的按钮</div>
    </div>
  </section>

  <section class="detail">
    <div class="row"><span>标题</span><b id="dTitle">—</b></div>
    <div class="row"><span>来源</span><b id="dUrl">—</b></div>
    <div class="row"><span>字数</span><b id="dChars">—</b></div>
    <div class="row"><span>收到</span><b id="dSent">—</b></div>
    <div class="row"><span>已读</span><b id="dRead">—</b></div>
  </section>

  <button id="send" class="primary">发送当前页面</button>
  <button id="openDsh" class="ghost wide" hidden>打开 DSH</button>

  <p class="hint">
    DSH 只在你发消息时运行：发送后回对话框说「读一下刚才的页面」，这里会变绿。
  </p>

  <script src="popup.js"></script>
</body>
</html>
