<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DSH Page Bridge · 状态面板</title>
<link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="20" height="20" />
    <strong>DSH Page Bridge</strong>
    <span id="conn" class="pill">连接中…</span>
  </header>

  <section id="card" class="card idle">
    <div id="statusIcon" class="status-icon">•</div>
    <div class="status-text">
      <div id="statusTitle">还没有发送页面</div>
      <div id="statusSub">在网页上按 Alt+Shift+S，或点下面的按钮</div>
    </div>
  </section>

  <section class="detail">
    <div class="row"><span>标题</span><b id="dTitle">—</b></div>
    <div class="row"><span>来源</span><b id="dUrl">—</b></div>
    <div class="row"><span>字数</span><b id="dChars">—</b></div>
    <div class="row"><span>收到</span><b id="dSent">—</b></div>
    <div class="row"><span>已读</span><b id="dRead">—</b></div>
  </section>

  <div class="actions">
    <button id="send" class="primary">发送当前页面</button>
    <button id="openDsh" class="ghost" hidden>打开 DSH</button>
  </div>

  <p class="hint">
    DSH 只在你发消息时才会运行：发送后回到对话框问一句「读一下刚才的页面」，<br />
    这里会变成「AI 已读取」。
  </p>

  <script src="panel.js"></script>
</body>
</html>
